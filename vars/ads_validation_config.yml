---
# ADS Lab Validation Configuration
# Uses the existing ocp_application_validation framework

# ADS lab configuration
# Common password for ADS components (override with -e common_password=yourpassword)
common_password: "{{ common_password | default('changeme') }}"

ocp_application_validation_list:
  # Single cluster validation - ADS has only one cluster (uses current kubeconfig)
  - cluster:
      name: ads-cluster
      onfail: ignore
    validations:
      # Baseline cluster validation
      - kind: Node
      - kind: StorageClass

      # ArgoCD (tssc-gitops) validation
      - kind: Route
        api_version: route.openshift.io/v1
        namespace: tssc-gitops
      - kind: Application
        namespace: tssc-gitops
      - kind: Secret
        name: tssc-gitops-cluster
        namespace: tssc-gitops

      # GitLab validation
      - kind: Deployment
        name: gitlab
        namespace: gitlab
        onfail: ignore
      - kind: Route
        api_version: route.openshift.io/v1
        name: gitlab
        namespace: gitlab
        onfail: ignore
      - kind: StatefulSet
        name: gitlab-postgresql
        namespace: gitlab
        onfail: ignore
      - kind: Secret
        name: gitlab-secret
        namespace: gitlab
        onfail: ignore

      # User Management Validation
      - kind: GitLabUsers
        namespace: gitlab
        secret_name: gitlab-secret
        route_name: gitlab
        onfail: ignore
      - kind: KeycloakUsers
        namespace: tssc-keycloak
        route_name: keycloak
        admin_secret_name: keycloak-initial-admin
        realm: ADS
        onfail: ignore

      # Jenkins validation
      - kind: Deployment
        name: jenkins
        namespace: jenkins
        onfail: ignore
      - kind: Route
        api_version: route.openshift.io/v1
        name: jenkins
        namespace: jenkins
        onfail: ignore
      - kind: PersistentVolumeClaim
        name: jenkins
        namespace: jenkins
        onfail: ignore

      # Red Hat Developer Hub validation
      - kind: Deployment
        name: developer-hub
        namespace: tssc-dh
        onfail: ignore
      - kind: Route
        api_version: route.openshift.io/v1
        name: backstage-developer-hub
        namespace: tssc-dh
        onfail: ignore
      - kind: Deployment
        name: backstage
        namespace: backstage
        onfail: ignore

      # OpenShift Dev Spaces validation
      - kind: Deployment
        name: devspaces-operator
        namespace: openshift-devspaces
        onfail: ignore
      - kind: CheCluster
        api_version: org.eclipse.che/v2
        name: devspaces
        namespace: openshift-devspaces
        onfail: ignore

      # Vault validation
      - kind: StatefulSet
        name: vault
        namespace: vault
        onfail: ignore
      - kind: Route
        name: vault
        namespace: vault
        onfail: ignore

      # External Secrets validation
      - kind: Deployment
        name: external-secrets
        namespace: external-secrets
        onfail: ignore
      - kind: Deployment
        name: external-secrets-webhook
        namespace: external-secrets
        onfail: ignore

      # RHACM validation
      - kind: Deployment
        name: multicluster-operators-hub-subscription
        namespace: open-cluster-management
        onfail: ignore
      - kind: MultiClusterHub
        api_version: operator.open-cluster-management.io/v1
        name: multiclusterhub
        namespace: open-cluster-management
        onfail: ignore

      # ACS/RHACS validation
      - kind: Central
        api_version: platform.stackrox.io/v1alpha1
        name: stackrox-central-services
        namespace: tssc-acs
        onfail: ignore
      - kind: Route
        name: central
        namespace: tssc-acs
        onfail: ignore

      # Keycloak/SSO validation
      - kind: StatefulSet
        name: keycloak
        namespace: tssc-keycloak
        onfail: ignore
      - kind: Route
        api_version: route.openshift.io/v1
        name: keycloak
        namespace: tssc-keycloak
        onfail: ignore
      - kind: StatefulSet
        name: keycloak
        namespace: rhsso
        onfail: ignore

      # Quay validation
      - kind: QuayRegistry
        api_version: quay.redhat.com/v1
        name: tssc-quay
        namespace: tssc-quay
        onfail: ignore
      - kind: Route
        api_version: route.openshift.io/v1
        name: tssc-quay-quay
        namespace: tssc-quay
        onfail: ignore

      # TPA validation
      - kind: Deployment
        name: trustification-ui
        namespace: tssc-tpa
        onfail: ignore
      - kind: Route
        api_version: route.openshift.io/v1
        namespace: tssc-tpa
        onfail: ignore

      # TAS (Trusted Artifact Signer) validation
      - kind: Route
        api_version: route.openshift.io/v1
        namespace: tssc-tas
        onfail: ignore

      # Showroom validation - discover all showroom routes cluster-wide
      - kind: Route
        api_version: route.openshift.io/v1
        name: showroom
        validate_content: true
        content_check: "lab"
        status_code: [200]
        onfail: ignore

      # Orchestrator/Sonataflow validation
      - kind: Deployment
        name: sonataflow-operator-controller-manager
        namespace: sonataflow-operator-system
        onfail: ignore
      - kind: SonataFlowPlatform
        api_version: sonataflow.org/v1alpha08
        name: sonataflow-platform
        namespace: sonataflow-infra
        onfail: ignore