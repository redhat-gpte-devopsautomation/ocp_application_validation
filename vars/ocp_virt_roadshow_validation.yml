        name: vmimported-user10
        onfail: ignore
      - kind: Namespace
        name: vmimported-user11
        onfail: ignore
      - kind: Namespace
        name: vmimported-user12
        onfail: ignore
      - kind: Namespace
        name: vmimported-user13
        onfail: ignore
      - kind: Namespace
        name: vmimported-user14
        onfail: ignore
      - kind: Namespace
        name: vmimported-user15
        onfail: ignore
      - kind: Namespace
        name: vmimported-user16
        onfail: ignore
      - kind: Namespace
        name: vmimported-user17
        onfail: ignore
      - kind: Namespace
        name: vmimported-user18
        onfail: ignore
      - kind: Namespace
