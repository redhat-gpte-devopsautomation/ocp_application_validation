        onfail: ignore

      # PHASE 13: VirtualMachine validation in vmimported-userX namespaces
      # Sample VMs from ocp4_workload_virt_roadshow_vms (database, winweb01, winweb02)
      - kind: VirtualMachine
        api_version: kubevirt.io/v1
        name: database
        namespace: vmimported-user1
        onfail: ignore
      - kind: VirtualMachine
        api_version: kubevirt.io/v1
        name: winweb01
        namespace: vmimported-user1
        onfail: ignore
      - kind: VirtualMachine
        api_version: kubevirt.io/v1
        name: winweb02
        namespace: vmimported-user1
        onfail: ignore
