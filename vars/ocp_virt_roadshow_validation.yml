---
# OCP Virtualization Roadshow Validation Configuration
# Based on AgnosticD common.yaml configuration for OCP_VIRT_ROADSHOW_MULTI_USER
# Uses the existing ocp_application_validation framework

# Common password for authentication (override with -e common_password=yourpassword)
common_password: "{{ common_password | default('changeme') }}"

ocp_application_validation_list:
  # Single cluster validation - OCP Virt roadshow has only one cluster (uses current kubeconfig)
  - cluster:
      name: ocp-virt-roadshow
      onfail: ignore
    validations:
      # PHASE 1: Infrastructure validation - ensure cluster is ready
      
      # Worker nodes validation (ensure we have worker nodes available for VMs)
      - kind: Node
        
      - kind: StorageClass

      # PHASE 2: ArgoCD Foundation - MUST sync first before checking anything else
      - kind: Application
        namespace: openshift-gitops
        sync_timeout: 90           # Wait up to 90 seconds for apps to sync
        delay: 15                  # Check every 15 seconds
        auto_discover: true        # Enable auto-discovery of resources from ArgoCD apps
        
      # ArgoCD infrastructure validation (ocp4_workload_openshift_gitops)
      - kind: Route
        api_version: route.openshift.io/v1
        namespace: openshift-gitops
      - kind: Secret
        name: openshift-gitops-cluster
        namespace: openshift-gitops

      # PHASE 3: Authentication validation (ocp4_workload_authentication - htpasswd)
      - kind: Secret
        name: htpasswd
        namespace: openshift-config
        onfail: ignore

      # PHASE 4: External ODF validation (ocp4_workload_external_odf)
      - kind: Deployment
        name: odf-operator-controller-manager
        namespace: openshift-storage
        onfail: ignore
      - kind: StorageCluster
        api_version: ocs.openshift.io/v1
        name: ocs-external-storagecluster
        namespace: openshift-storage
        onfail: ignore

      # PHASE 5: Certificate Manager validation (ocp4_workload_cert_manager)
      - kind: Deployment
        name: cert-manager
        namespace: cert-manager-operator
        onfail: ignore

      # PHASE 6: KubeVirt validation (ocp4_workload_kubevirt)
      - kind: CustomResourceDefinition
        name: kubevirts.kubevirt.io
        api_version: apiextensions.k8s.io/v1
      - kind: Deployment
        name: hco-operator
        namespace: openshift-cnv
        onfail: ignore
      - kind: HyperConverged
        api_version: hco.kubevirt.io/v1beta1
        name: kubevirt-hyperconverged
        namespace: openshift-cnv
        onfail: ignore

      # PHASE 7: MTV validation (ocp4_workload_mtv)
      - kind: Deployment
        name: forklift-operator
        namespace: openshift-mtv
        onfail: ignore
      - kind: Deployment
        name: forklift-controller
        namespace: openshift-mtv
        onfail: ignore

      # PHASE 8: Web Terminal validation (ocp4_workload_web_terminal)
      - kind: Deployment
        name: web-terminal-controller-manager
        namespace: openshift-operators
        onfail: ignore

      # PHASE 9: OADP validation (ocp4_workload_oadp_gitops)
      - kind: Deployment
        name: openshift-adp-controller-manager
        namespace: openshift-adp
        onfail: ignore

      # PHASE 10: NMState validation (ocp4_workload_nmstate)
      - kind: Deployment
        name: nmstate-operator
        namespace: openshift-nmstate
        onfail: ignore

      # PHASE 11: HTPasswd User Discovery validation 
      # First, validate the htpasswd secret exists and contains user data
      - kind: Secret
        name: htpasswd
        namespace: openshift-config
        # This secret contains the user list for dynamic validation
        
      # PHASE 12: Showroom validation (ocp4_workload_showroom)
      # This validates all showroom* deployments and routes cluster-wide
      # and will show which user showrooms have issues
      - kind: ShowroomValidation
        onfail: ignore

      # PHASE 13: Dynamic Multi-user validation
      # TODO: Enhance framework to support dynamic user discovery from htpasswd secret
      # The htpasswd secret in openshift-config contains user list (excluding admin)
      # This validation should be templated to loop through actual users
      # For now, validating sample users as proof of concept
      
      # MTV user namespaces (mtv-userX from ocp4_workload_virt_roadshow_vmware)
      - kind: Namespace
        name: mtv-user1
        onfail: ignore
      - kind: Namespace
        name: mtv-user2
        onfail: ignore

      # VM imported user namespaces (vmimported-userX from ocp4_workload_virt_roadshow_vms)  
      - kind: Namespace
        name: vmimported-user1
        onfail: ignore
      - kind: Namespace
        name: vmimported-user2
        onfail: ignore

      # OADP user namespaces (oadp-userX from ocp4_workload_oadp_gitops)
      - kind: Namespace
        name: oadp-user1
        onfail: ignore
      - kind: Namespace  
        name: oadp-user2
        onfail: ignore

      # PHASE 14: VirtualMachine validation in sample vmimported-userX namespaces
      # VMs from ocp4_workload_virt_roadshow_vms (database, winweb01, winweb02)
      - kind: VirtualMachine
        api_version: kubevirt.io/v1
        name: database
        namespace: vmimported-user1
        onfail: ignore
      - kind: VirtualMachine
        api_version: kubevirt.io/v1
        name: winweb01
        namespace: vmimported-user1
        onfail: ignore
      - kind: VirtualMachine
        api_version: kubevirt.io/v1
        name: winweb02
        namespace: vmimported-user1
        onfail: ignore
        
      # Additional user VMs for user2 (if exists)
      - kind: VirtualMachine
        api_version: kubevirt.io/v1
        name: database
        namespace: vmimported-user2
        onfail: ignore
      - kind: VirtualMachine
        api_version: kubevirt.io/v1
        name: winweb01
        namespace: vmimported-user2
        onfail: ignore
      - kind: VirtualMachine
        api_version: kubevirt.io/v1
        name: winweb02
        namespace: vmimported-user2
        onfail: ignore
