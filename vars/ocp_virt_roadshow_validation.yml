        onfail: ignore

      # OADP user namespaces (oadp-userX from ocp4_workload_oadp_gitops)
      - kind: Namespace
        name: oadp-user1
        onfail: ignore
      - kind: Namespace
        name: oadp-user2
        onfail: ignore
      - kind: Namespace
        name: oadp-user3
        onfail: ignore
      - kind: Namespace
        name: oadp-user4
        onfail: ignore
      - kind: Namespace
        name: oadp-user5
        onfail: ignore
      - kind: Namespace
        name: oadp-user6
        onfail: ignore
      - kind: Namespace
        name: oadp-user7
        onfail: ignore
      - kind: Namespace
