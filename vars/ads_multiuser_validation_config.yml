---
# ADS Multi-User Lab Validation Configuration
# Validates that dynamic user provisioning worked for N users

ads_multiuser_validation_config:
  # Baseline infrastructure validation
  - cluster:
      name: baseline
      onfail: fail
    validations:
      # Cluster health
      - kind: Node
        conditions:
          - _r_validate_universal.resources | length > 0
          - _r_validate_universal.resources | selectattr('status.conditions', 'defined') | selectattr('status.conditions', 'selectattr', 'type', 'equalto', 'Ready') | selectattr('status.conditions', 'selectattr', 'status', 'equalto', 'True') | list | length == (_r_validate_universal.resources | length)
        retries: 10
        delay: 5

      # Storage
      - kind: StorageClass
        conditions:
          - _r_validate_universal.resources | length > 0
          - _r_validate_universal.resources | selectattr('metadata.annotations', 'defined') | selectattr('metadata.annotations', 'match', '.*storageclass.kubernetes.io/is-default-class.*true.*') | list | length > 0
        retries: 5
        delay: 5

  # Keycloak user validation
  - cluster:
      name: keycloak_users
      onfail: fail
    validations:
      # Keycloak is running
      - kind: StatefulSet
        name: keycloak
        namespace: "{{ keycloak_namespace | default('tssc-keycloak') }}"
        conditions:
          - _r_validate_universal.resources | length > 0
          - _r_validate_universal.resources[0].status.readyReplicas | default(0) >= 1
        retries: 60
        delay: 15

      # Keycloak route accessible
      - kind: Route
        name: keycloak
        namespace: "{{ keycloak_namespace | default('tssc-keycloak') }}"
        status_code: [200, 302]
        retries: 30
        delay: 10

  # GitLab user validation  
  - cluster:
      name: gitlab_users
      onfail: fail
    validations:
      # GitLab is running
      - kind: Deployment
        name: gitlab-webservice-default
        namespace: "{{ gitlab_namespace | default('gitlab') }}"
        conditions:
          - _r_validate_universal.resources | length > 0
          - _r_validate_universal.resources[0].status.readyReplicas | default(0) >= 1
        retries: 120
        delay: 15

      # GitLab route accessible
      - kind: Route
        name: gitlab
        namespace: "{{ gitlab_namespace | default('gitlab') }}"
        status_code: [200, 302]
        retries: 60
        delay: 15

  # User namespace validation
  - cluster:
      name: user_namespaces
      onfail: fail
    validations:
      # Check that user namespaces exist
      # This will be dynamically generated per user
      - kind: Namespace
        name: "{{ user_base_name | default('user') }}{{ item }}"
        retries: 10
        delay: 5

  # Showroom multi-user validation
  - cluster:
      name: showroom_multiuser
      onfail: ignore
    validations:
      # Main showroom deployment
      - kind: Deployment
        name: showroom
        namespace: showroom
        conditions:
          - _r_validate_universal.resources | length > 0
          - _r_validate_universal.resources[0].status.readyReplicas | default(0) >= 1
        retries: 60
        delay: 15

      # Showroom route accessible
      - kind: Route
        name: showroom
        namespace: showroom
        status_code: [200, 302]
        retries: 30
        delay: 10

  # RHDH user components validation
  - cluster:
      name: rhdh_user_components
      onfail: ignore
    validations:
      # RHDH main deployment
      - kind: Deployment
        name: developer-hub
        namespace: "{{ rhdh_namespace | default('tssc-dh') }}"
        conditions:
          - _r_validate_universal.resources | length > 0
          - _r_validate_universal.resources[0].status.readyReplicas | default(0) >= 1
        retries: 90
        delay: 15

      # RHDH route
      - kind: Route
        name: developer-hub
        namespace: "{{ rhdh_namespace | default('tssc-dh') }}"
        status_code: [200, 302]
        retries: 60
        delay: 15

  # User-specific pipeline validation
  - cluster:
      name: user_pipelines
      onfail: ignore
    validations:
      # Check user development namespaces
      - kind: Namespace
        name: "{{ user_base_name | default('user') }}{{ item }}-dev"
        retries: 10
        delay: 5

      # Check user staging namespaces  
      - kind: Namespace
        name: "{{ user_base_name | default('user') }}{{ item }}-stage"
        retries: 10
        delay: 5

      # Check user production namespaces
      - kind: Namespace
        name: "{{ user_base_name | default('user') }}{{ item }}-prod"
        retries: 10
        delay: 5

  # User application validation
  - cluster:
      name: user_applications
      onfail: ignore
    validations:
      # Check for user applications in dev namespace
      - kind: Deployment
        namespace: "{{ user_base_name | default('user') }}{{ item }}-dev"
        conditions:
          - _r_validate_universal.resources | length >= 0  # May not exist yet
        retries: 30
        delay: 10
        onfail: ignore

# Custom validation tasks for multi-user scenarios
# These will be implemented as custom task files