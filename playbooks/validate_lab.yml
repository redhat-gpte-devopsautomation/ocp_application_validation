---
- name: Validate Lab Environment
  hosts: localhost
  gather_facts: false
  vars:
    validate_timeout: "{{ validate_timeout | default(600) }}"
    strict: "{{ strict | default(false) }}"
    
    # User validation configuration - auto-discovers users from authentication backend
    ocp_application_validation_multiuser_enabled: "{{ ocp_application_validation_multiuser_enabled | default(false) }}"
    user_base_name: "{{ user_base_name | default('user') }}"
    keycloak_namespace: "{{ keycloak_namespace | default('keycloak') }}"
    keycloak_realm: "{{ keycloak_realm | default('workshop') }}"
    gitlab_namespace: "{{ gitlab_namespace | default('gitlab') }}"
    rhdh_namespace: "{{ rhdh_namespace | default('rhdh') }}"
    
  tasks:
    - name: "=== Lab Environment Validation Started ==="
      ansible.builtin.debug:
        msg: |
          Starting validation of lab environment
          Timeout: {{ validate_timeout }}s
          Strict mode: {{ strict }}
          User validation: {{ ocp_application_validation_multiuser_enabled }}

    - name: Execute lab environment validation
      ansible.builtin.include_role:
        name: "{{ playbook_dir }}/.."
      vars:
        ocp_application_validation_file_path: "/tmp/lab_validation_{{ ansible_date_time.epoch }}"
        ocp_application_validation_remove_testaments: true
        ocp_application_validation_result_path: "/tmp/lab_validation_results_{{ ansible_date_time.epoch }}/"
        ocp_application_validation_list: "{{ validation_config | default(ads_validation_config | default(ocp4_getting_started_validation | default([]))) }}"
        
        # Pass user validation variables to the role
        ocp_application_validation_multiuser_enabled: "{{ ocp_application_validation_multiuser_enabled }}"
        ocp_application_validation_user_base_name: "{{ user_base_name }}"
        ocp_application_validation_keycloak_namespace: "{{ keycloak_namespace }}"
        ocp_application_validation_keycloak_realm: "{{ keycloak_realm }}"
        ocp_application_validation_gitlab_namespace: "{{ gitlab_namespace }}"
        ocp_application_validation_rhdh_namespace: "{{ rhdh_namespace }}"

    - name: Generate final validation report
      ansible.builtin.template:
        src: ads_validation_report.j2
        dest: "./validation-results.json"
        mode: '0644'

    - name: "=== Validation Summary ==="
      ansible.builtin.debug:
        msg: |
          Validation completed
          Total checks: {{ validation_results | length }}
          Passed: {{ validation_results | selectattr('status', 'equalto', 'PASS') | list | length }}
          Failed: {{ validation_results | selectattr('status', 'equalto', 'FAIL') | list | length }}
          Warnings: {{ validation_results | selectattr('status', 'equalto', 'WARN') | list | length }}
          {{ 'User checks: ' + (validation_results | selectattr('scope', 'match', '.*user.*') | list | length | string) if ocp_application_validation_multiuser_enabled else '' }}

    - name: Fail if any critical checks failed
      ansible.builtin.fail:
        msg: "Validation failed with {{ validation_results | selectattr('status', 'equalto', 'FAIL') | list | length }} critical errors"
      when: 
        - validation_results | selectattr('status', 'equalto', 'FAIL') | list | length > 0
        - strict | bool

  vars_files:
    - ../vars/ads_validation_config.yml