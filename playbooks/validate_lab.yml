---
- name: Validate Lab Environment
  hosts: localhost
  gather_facts: true
  vars:
    _validate_timeout: "{{ validate_timeout | default(600) }}"
    _strict: "{{ strict | default(false) }}"
    
  tasks:
    - name: "=== Lab Environment Validation Started ==="
      ansible.builtin.debug:
        msg: |
          Starting validation of lab environment
          Timeout: {{ _validate_timeout }}s
          Strict mode: {{ _strict }}
          User validation: {{ ocp_application_validation_multiuser_enabled | default(false) }}

    - name: Debug validation configuration
      ansible.builtin.debug:
        msg: |
          Validation List: {{ ocp_application_validation_list | default('NOT DEFINED') }}
          List Length: {{ ocp_application_validation_list | default([]) | length }}

    - name: Execute lab environment validation
      ansible.builtin.include_role:
        name: "{{ playbook_dir }}/.."
      vars:
        ocp_application_validation_file_path: "/tmp/lab_validation_{{ ansible_date_time.epoch }}"
        ocp_application_validation_remove_testaments: true
        ocp_application_validation_result_path: "/tmp/lab_validation_results_{{ ansible_date_time.epoch }}/"
        # ocp_application_validation_list is loaded from vars file
        
        # User validation variables are loaded from vars file or command line

    - name: Retrieve validation results from AgnosticD user data
      set_fact:
        validation_results_raw: "{{ lookup('agnosticd_user_data', 'ocp_application_validation_results', wantlist=True) | default([]) }}"

    - name: Flatten validation results
      set_fact:
        validation_results: "{{ validation_results_raw | flatten }}"

    - name: "=== Validation Summary ==="
      ansible.builtin.debug:
        msg: |
          Validation completed
          Total checks: {{ validation_results | length }}
          Passed: {{ validation_results | select('search', 'PASS') | list | length }}
          Failed: {{ validation_results | select('search', 'FAIL') | list | length }}
          Warnings: {{ validation_results | select('search', 'WARN') | list | length }}

    - name: Fail if any critical checks failed
      ansible.builtin.fail:
        msg: "Validation failed with {{ validation_results | select('search', 'FAIL') | list | length }} critical errors"
      when: 
        - validation_results | select('search', 'FAIL') | list | length > 0
        - _strict | bool

