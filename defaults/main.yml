---
# Path for validation task files
ocp_application_validation_file_path: /tmp/validations/{{ guid[:5] | d('common') }}/testaments
# Boolean to remmove validation directory at the end
ocp_application_validation_remove_testaments: true

# Path for result directory
ocp_application_validation_result_path: /tmp/validations/{{ guid[:5] | d('common') }}/

# Example list of cluster and validation
ocp_application_validation_list:
  - cluster: 
      name: local
    validations: 
      - kind: Route
        name: openshift-gitops-server
        namespace: openshift-gitops
        retries: 1

# User validation configuration - enables user discovery and validation
ocp_application_validation_multiuser_enabled: false
ocp_application_validation_user_base_name: user
ocp_application_validation_auth_type: rhsso  # rhsso, rhbk, htpasswd
ocp_application_validation_keycloak_namespace: keycloak
ocp_application_validation_keycloak_realm: workshop
ocp_application_validation_gitlab_namespace: gitlab
ocp_application_validation_rhdh_namespace: rhdh
ocp_application_validation_technology: generic
# ArgoCD configuration for GitOps validation
ocp_application_validation_argocd_namespace: openshift-gitops
ocp_application_validation_argocd_admin_secret: openshift-gitops-cluster

