---
# Validate multi-user environment based on discovered users from Keycloak
# This validates GitLab users, Showroom, and user-specific components

- name: "=== Validating Multi-User Environment ==="
  ansible.builtin.debug:
    msg: |
      Validating multi-user environment for {{ discovered_workshop_users | length }} users
      Users: {{ discovered_workshop_users | join(', ') }}

# ============================================================================
# Git Repository User Validation (GitLab or Gitea)
# ============================================================================

- name: "--- Git Repository User Validation ---"
  ansible.builtin.debug:
    msg: "Checking if all {{ discovered_workshop_users | length }} users exist in {{ git_service_type | default('GitLab') }}"

- name: Determine git service type
  ansible.builtin.set_fact:
    git_service_type: "{{ 'Gitea' if gitlab_namespace == 'gitea' else 'GitLab' }}"

- name: Get Git service route
  kubernetes.core.k8s_info:
    api_version: route.openshift.io/v1
    kind: Route
    name: "{{ 'gitea' if git_service_type == 'Gitea' else 'gitlab' }}"
    namespace: "{{ gitlab_namespace }}"
  register: r_git_route

- name: Set Git service URL
  ansible.builtin.set_fact:
    git_url: "https://{{ r_git_route.resources[0].spec.host }}"
  when: r_git_route.resources | length > 0

- name: Test Git service accessibility
  ansible.builtin.uri:
    url: "{{ git_url }}"
    method: GET
    validate_certs: false
    status_code: [200, 302]
  register: r_git_access
  when: git_url is defined

- name: Add Git service accessibility result
  ansible.builtin.set_fact:
    validation_results: "{{ validation_results + [git_access_result] }}"
  vars:
    git_access_result:
      scope: "{{ git_service_type | lower }}_infrastructure"
      check: "{{ git_service_type }} route accessibility"
      status: "{{ 'PASS' if (r_git_access is defined and not r_git_access.failed) else 'FAIL' }}"
      detail: "{{ git_service_type + ' accessible at ' + git_url if (r_git_access is defined and not r_git_access.failed) else git_service_type + ' not accessible' }}"

- name: Get Git service admin credentials
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    name: "{{ 'gitea-admin-secret' if git_service_type == 'Gitea' else 'gitlab-gitlab-initial-root-password' }}"
    namespace: "{{ gitlab_namespace }}"
  register: r_git_admin_secret
  when: git_url is defined

- name: Set Git service admin credentials
  ansible.builtin.set_fact:
    git_admin_username: "{{ (r_git_admin_secret.resources[0].data.username | b64decode) if git_service_type == 'Gitea' else 'root' }}"
    git_admin_password: "{{ r_git_admin_secret.resources[0].data.password | b64decode }}"
  when: r_git_admin_secret.resources | length > 0

- name: Get Git service API session (GitLab)
  ansible.builtin.uri:
    url: "{{ git_url }}/api/v4/session"
    method: POST
    validate_certs: false
    body_format: form-urlencoded
    body:
      login: "{{ git_admin_username }}"
      password: "{{ git_admin_password }}"
  register: r_git_session
  when: 
    - git_service_type == 'GitLab'
    - git_url is defined
    - git_admin_password is defined

- name: Get all Git service users (GitLab)
  ansible.builtin.uri:
    url: "{{ git_url }}/api/v4/users"
    method: GET
    validate_certs: false
    headers:
      Private-Token: "{{ r_git_session.json.private_token }}"
  register: r_git_users_gitlab
  when: 
    - git_service_type == 'GitLab'
    - r_git_session is defined
    - not r_git_session.failed

- name: Get all Git service users (Gitea)
  ansible.builtin.uri:
    url: "{{ git_url }}/api/v1/admin/users"
    method: GET
    validate_certs: false
    user: "{{ git_admin_username }}"
    password: "{{ git_admin_password }}"
    force_basic_auth: true
  register: r_git_users_gitea
  when: 
    - git_service_type == 'Gitea'
    - git_url is defined
    - git_admin_password is defined

- name: Extract Git service usernames
  ansible.builtin.set_fact:
    git_all_users: "{{ (r_git_users_gitlab.json if git_service_type == 'GitLab' else r_git_users_gitea.json) | map(attribute='username') | list }}"
  when: 
    - (r_git_users_gitlab is defined and not r_git_users_gitlab.failed) or (r_git_users_gitea is defined and not r_git_users_gitea.failed)

- name: Validate each discovered user exists in Git service
  ansible.builtin.set_fact:
    validation_results: "{{ validation_results + [user_result] }}"
  vars:
    user_exists: "{{ item in (git_all_users | default([])) }}"
    user_result:
      scope: "{{ git_service_type | lower }}_users"
      check: "{{ item }} user existence in {{ git_service_type }}"
      status: "{{ 'PASS' if user_exists else 'FAIL' }}"
      detail: "{{ 'User ' + item + ' found in ' + git_service_type if user_exists else 'User ' + item + ' not found in ' + git_service_type }}"
  loop: "{{ discovered_workshop_users }}"

- name: Git service user summary
  ansible.builtin.set_fact:
    git_users_found: "{{ discovered_workshop_users | intersect(git_all_users | default([])) }}"
    git_users_missing: "{{ discovered_workshop_users | difference(git_all_users | default([])) }}"

- name: Add Git service user summary result
  ansible.builtin.set_fact:
    validation_results: "{{ validation_results + [git_summary] }}"
  vars:
    git_summary:
      scope: "{{ git_service_type | lower }}_user_summary"
      check: "{{ git_service_type }} user provisioning summary"
      status: "{{ 'PASS' if git_users_missing | length == 0 else 'FAIL' }}"
      detail: "{{ git_users_found | length }}/{{ discovered_workshop_users | length }} users found in {{ git_service_type }}. Missing: {{ git_users_missing | join(', ') if git_users_missing | length > 0 else 'none' }}"

# ============================================================================
# GitOps Applications Validation (for labs using GitOps bootstrap)
# ============================================================================

- name: "--- GitOps Applications Validation ---"
  ansible.builtin.debug:
    msg: "Checking GitOps applications for automated user setup"

- name: Check for GitOps bootstrap application
  kubernetes.core.k8s_info:
    api_version: argoproj.io/v1alpha1
    kind: Application
    name: bootstrap
    namespace: openshift-gitops
  register: r_bootstrap_app

- name: Add GitOps bootstrap application result
  ansible.builtin.set_fact:
    validation_results: "{{ validation_results + [bootstrap_result] }}"
  vars:
    bootstrap_healthy: "{{ r_bootstrap_app.resources | length > 0 and r_bootstrap_app.resources[0].status.health.status | default('') == 'Healthy' }}"
    bootstrap_synced: "{{ r_bootstrap_app.resources | length > 0 and r_bootstrap_app.resources[0].status.sync.status | default('') == 'Synced' }}"
    bootstrap_result:
      scope: "gitops_applications"
      check: "GitOps bootstrap application"
      status: "{{ 'PASS' if (bootstrap_healthy and bootstrap_synced) else 'WARN' if r_bootstrap_app.resources | length > 0 else 'SKIP' }}"
      detail: "{{ 'Bootstrap application is healthy and synced' if (bootstrap_healthy and bootstrap_synced) else 'Bootstrap application exists but not healthy/synced' if r_bootstrap_app.resources | length > 0 else 'No GitOps bootstrap application found (manual setup)' }}"

- name: Check for user-related GitOps applications
  kubernetes.core.k8s_info:
    api_version: argoproj.io/v1alpha1
    kind: Application
    namespace: openshift-gitops
  register: r_all_gitops_apps

- name: Filter user-related GitOps applications
  ansible.builtin.set_fact:
    user_gitops_apps: "{{ r_all_gitops_apps.resources | default([]) | selectattr('metadata.name', 'match', '.*(' + discovered_workshop_users | join('|') + ').*') | list }}"
  when: r_all_gitops_apps.resources is defined

- name: Add user GitOps applications result
  ansible.builtin.set_fact:
    validation_results: "{{ validation_results + [user_gitops_result] }}"
  vars:
    user_apps_count: "{{ user_gitops_apps | default([]) | length }}"
    user_gitops_result:
      scope: "gitops_user_apps"
      check: "User-specific GitOps applications"
      status: "{{ 'PASS' if user_apps_count > 0 else 'WARN' }}"
      detail: "{{ 'Found ' + (user_apps_count | string) + ' user-related GitOps applications' if user_apps_count > 0 else 'No user-specific GitOps applications found (may not be GitOps-managed lab)' }}"

# ============================================================================
# Showroom Validation
# ============================================================================

- name: "--- Showroom Multi-User Validation ---"
  ansible.builtin.debug:
    msg: "Validating Showroom for multi-user access"

- name: Check Showroom deployment
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: Deployment
    name: showroom
    namespace: showroom
  register: r_showroom_deployment

- name: Add Showroom deployment result
  ansible.builtin.set_fact:
    validation_results: "{{ validation_results + [showroom_deployment_result] }}"
  vars:
    deployment_ready: "{{ r_showroom_deployment.resources | length > 0 and r_showroom_deployment.resources[0].status.readyReplicas | default(0) >= 1 }}"
    showroom_deployment_result:
      scope: "showroom_infrastructure"
      check: "Showroom deployment readiness"
      status: "{{ 'PASS' if deployment_ready else 'FAIL' }}"
      detail: "{{ 'Showroom deployment is ready with ' + (r_showroom_deployment.resources[0].status.readyReplicas | default(0) | string) + ' replicas' if deployment_ready else 'Showroom deployment not ready or not found' }}"

- name: Get Showroom route
  kubernetes.core.k8s_info:
    api_version: route.openshift.io/v1
    kind: Route
    name: showroom
    namespace: showroom
  register: r_showroom_route

- name: Set Showroom URL
  ansible.builtin.set_fact:
    showroom_url: "https://{{ r_showroom_route.resources[0].spec.host }}"
  when: r_showroom_route.resources | length > 0

- name: Test Showroom accessibility
  ansible.builtin.uri:
    url: "{{ showroom_url }}"
    method: GET
    validate_certs: false
    status_code: [200, 302]
  register: r_showroom_access
  when: showroom_url is defined

- name: Add Showroom accessibility result
  ansible.builtin.set_fact:
    validation_results: "{{ validation_results + [showroom_access_result] }}"
  vars:
    showroom_access_result:
      scope: "showroom_access"
      check: "Showroom route accessibility"
      status: "{{ 'PASS' if (r_showroom_access is defined and not r_showroom_access.failed) else 'FAIL' }}"
      detail: "{{ 'Showroom accessible at ' + showroom_url if (r_showroom_access is defined and not r_showroom_access.failed) else 'Showroom not accessible' }}"

# ============================================================================
# Showroom User-Specific Content Validation
# ============================================================================

- name: "--- Showroom User Content Validation ---"
  ansible.builtin.debug:
    msg: "Validating user-specific Showroom content for {{ discovered_workshop_users | length }} users"

- name: Check Showroom user-specific content
  ansible.builtin.uri:
    url: "{{ showroom_url }}/user/{{ item }}"
    method: GET
    validate_certs: false
    status_code: [200, 302]
  register: r_showroom_user_content
  loop: "{{ discovered_workshop_users[:5] }}"  # Test first 5 users
  when: 
    - showroom_url is defined
    - discovered_workshop_users | length > 0
  ignore_errors: true

- name: Add Showroom user content validation results
  ansible.builtin.set_fact:
    validation_results: "{{ validation_results + [showroom_user_result] }}"
  vars:
    user_content_checks: "{{ r_showroom_user_content.results | default([]) }}"
    successful_user_checks: "{{ user_content_checks | selectattr('failed', 'undefined') | list }}"
    showroom_user_result:
      scope: "showroom_user_content"
      check: "Showroom user-specific content"
      status: "{{ 'PASS' if (user_content_checks | length > 0 and successful_user_checks | length == user_content_checks | length) else 'WARN' if user_content_checks | length > 0 else 'SKIP' }}"
      detail: "{{ 'User-specific content accessible for ' + (successful_user_checks | length | string) + '/' + (user_content_checks | length | string) + ' tested users' if user_content_checks | length > 0 else 'No user-specific content validation performed (no users or Showroom not accessible)' }}"
  when: r_showroom_user_content is defined

- name: Check Showroom configuration for lab instructions
  ansible.builtin.uri:
    url: "{{ showroom_url }}/api/config"
    method: GET
    validate_certs: false
    status_code: [200, 404]
  register: r_showroom_config
  when: showroom_url is defined
  ignore_errors: true

- name: Validate Showroom lab configuration
  ansible.builtin.set_fact:
    validation_results: "{{ validation_results + [showroom_config_result] }}"
  vars:
    config_accessible: "{{ r_showroom_config is defined and not r_showroom_config.failed and r_showroom_config.status == 200 }}"
    has_lab_content: "{{ config_accessible and r_showroom_config.json is defined and (r_showroom_config.json.modules is defined or r_showroom_config.json.content is defined) }}"
    showroom_config_result:
      scope: "showroom_configuration"
      check: "Showroom lab configuration"
      status: "{{ 'PASS' if has_lab_content else 'WARN' if config_accessible else 'SKIP' }}"
      detail: "{{ 'Lab configuration contains modules/content for instructions' if has_lab_content else 'Lab configuration accessible but no modules/content found' if config_accessible else 'Lab configuration not accessible or not available' }}"
  when: r_showroom_config is defined

- name: Check for Showroom environment variables (user substitution)
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: Deployment
    name: showroom
    namespace: showroom
  register: r_showroom_env_check

- name: Validate Showroom user environment configuration
  ansible.builtin.set_fact:
    validation_results: "{{ validation_results + [showroom_env_result] }}"
  vars:
    deployment_exists: "{{ r_showroom_env_check.resources | length > 0 }}"
    env_vars: "{{ r_showroom_env_check.resources[0].spec.template.spec.containers[0].env | default([]) if deployment_exists else [] }}"
    has_user_vars: "{{ env_vars | selectattr('name', 'match', '.*(USER|GUID|LAB).*') | list | length > 0 }}"
    showroom_env_result:
      scope: "showroom_user_environment"
      check: "Showroom user environment configuration"
      status: "{{ 'PASS' if has_user_vars else 'WARN' if deployment_exists else 'SKIP' }}"
      detail: "{{ 'Found ' + (env_vars | selectattr('name', 'match', '.*(USER|GUID|LAB).*') | list | length | string) + ' user-related environment variables' if has_user_vars else 'No user-related environment variables found (may use different substitution method)' if deployment_exists else 'Showroom deployment not found' }}"

- name: Check Showroom environment variables for user count
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: Deployment
    name: showroom
    namespace: showroom
  register: r_showroom_deployment_env

- name: Extract user count from Showroom deployment
  ansible.builtin.set_fact:
    showroom_user_count: "{{ r_showroom_deployment_env.resources[0].spec.template.spec.containers[0].env | selectattr('name', 'equalto', 'USER_COUNT') | map(attribute='value') | first | default('0') }}"
  when: 
    - r_showroom_deployment_env.resources | length > 0
    - r_showroom_deployment_env.resources[0].spec.template.spec.containers[0].env is defined

- name: Check for any Showroom user-related ConfigMaps
  kubernetes.core.k8s_info:
    api_version: v1
    kind: ConfigMap
    namespace: showroom
  register: r_showroom_all_configmaps

- name: Filter user-related Showroom ConfigMaps
  ansible.builtin.set_fact:
    showroom_user_configmaps: "{{ r_showroom_all_configmaps.resources | default([]) | selectattr('metadata.name', 'match', '.*(' + discovered_workshop_users | join('|') + ').*') | list }}"
  when: r_showroom_all_configmaps.resources is defined

- name: Add Showroom user configuration result
  ansible.builtin.set_fact:
    validation_results: "{{ validation_results + [showroom_userdata_result] }}"
  vars:
    expected_user_count: "{{ discovered_workshop_users | length }}"
    configured_user_count: "{{ showroom_user_count | default('0') | int }}"
    user_configmaps_count: "{{ showroom_user_configmaps | default([]) | length }}"
    has_user_config: "{{ user_configmaps_count > 0 or configured_user_count > 0 }}"
    showroom_userdata_result:
      scope: "showroom_userdata"
      check: "Showroom user configuration"
      status: "{{ 'PASS' if has_user_config else 'WARN' }}"
      detail: "{{ 'Showroom configured for ' + (configured_user_count | string) + ' users with ' + (user_configmaps_count | string) + ' user-related ConfigMaps' if has_user_config else 'No user-specific configuration found in Showroom (may be content-only mode)' }}"


# ============================================================================
# User Project Repositories Validation
# ============================================================================

- name: "--- User Git Repository Projects Validation ---"
  ansible.builtin.debug:
    msg: "Checking for user projects in {{ git_service_type }}"

- name: Get user projects from GitLab
  ansible.builtin.uri:
    url: "{{ git_url }}/api/v4/projects?simple=true&per_page=100"
    method: GET
    validate_certs: false
    headers:
      Private-Token: "{{ r_git_session.json.private_token }}"
  register: r_git_projects_gitlab
  when: 
    - git_service_type == 'GitLab'
    - r_git_session is defined
    - not r_git_session.failed

- name: Get user projects from Gitea
  ansible.builtin.uri:
    url: "{{ git_url }}/api/v1/repos/search?limit=100"
    method: GET
    validate_certs: false
    user: "{{ git_admin_username }}"
    password: "{{ git_admin_password }}"
    force_basic_auth: true
  register: r_git_projects_gitea
  when: 
    - git_service_type == 'Gitea'
    - git_url is defined
    - git_admin_password is defined

- name: Extract user project names
  ansible.builtin.set_fact:
    git_user_projects: "{{ ((r_git_projects_gitlab.json if git_service_type == 'GitLab' else r_git_projects_gitea.json.data) | default([]) | map(attribute='name') | select('match', '.*(' + discovered_workshop_users | join('|') + ').*') | list) }}"
  when: 
    - (r_git_projects_gitlab is defined and not r_git_projects_gitlab.failed) or (r_git_projects_gitea is defined and not r_git_projects_gitea.failed)

- name: Add Git service projects result
  ansible.builtin.set_fact:
    validation_results: "{{ validation_results + [git_projects_result] }}"
  vars:
    projects_found: "{{ git_user_projects | default([]) | length }}"
    git_projects_result:
      scope: "{{ git_service_type | lower }}_projects"
      check: "User projects in {{ git_service_type }}"
      status: "{{ 'PASS' if projects_found > 0 else 'WARN' }}"
      detail: "{{ 'Found ' + (projects_found | string) + ' user-related projects in ' + git_service_type if projects_found > 0 else 'No user-related projects found in ' + git_service_type + ' (users may not have created projects yet)' }}"

# ============================================================================
# Final Multi-User Summary
# ============================================================================

- name: "=== Multi-User Environment Summary ==="
  ansible.builtin.debug:
    msg: |
      Multi-user environment validation completed
      
      Workshop Users: {{ discovered_workshop_users | length }}
      - Users in Keycloak: {{ discovered_workshop_users | length }}/{{ discovered_workshop_users | length }} ✓
      - Users in {{ git_service_type }}: {{ git_users_found | default([]) | length }}/{{ discovered_workshop_users | length }} {{ '✓' if (git_users_missing | default([]) | length == 0) else '✗' }}
      
      Infrastructure:
      - Showroom: {{ '✓' if (validation_results | selectattr('scope', 'equalto', 'showroom_access') | selectattr('status', 'equalto', 'PASS') | list | length > 0) else '✗' }}
      - {{ git_service_type }}: {{ '✓' if (validation_results | selectattr('scope', 'equalto', git_service_type | lower + '_infrastructure') | selectattr('status', 'equalto', 'PASS') | list | length > 0) else '✗' }}
      
      User Content:
      - {{ git_service_type }} Projects: {{ git_user_projects | default([]) | length }}
      
      GitOps Applications:
      - Bootstrap App: {{ '✓' if (validation_results | selectattr('scope', 'equalto', 'gitops_applications') | selectattr('status', 'equalto', 'PASS') | list | length > 0) else 'N/A' }}
      - User GitOps Apps: {{ user_gitops_apps | default([]) | length }}

# ============================================================================
# Technology-Specific Validations
# ============================================================================

- name: Run RHDH validation for RHADS technology
  ansible.builtin.include_tasks: ./rhdh_validation.yml
  when: ocp_application_validation_technology | default('') == 'rhads'

- name: Run KubeVirt validation for kubevirt technology
  ansible.builtin.include_tasks: ./kubevirt_validation.yml
  when: ocp_application_validation_technology | default('') == 'kubevirt'