---
# OpenShift Virtualization (KubeVirt) specific validation
# This validates KubeVirt infrastructure, VMs, and user-specific VM workloads
# Used in OpenShift Virtualization roadshow labs

- name: "=== OpenShift Virtualization Validation Started ==="
  ansible.builtin.debug:
    msg: |
      Starting OpenShift Virtualization (KubeVirt) validation
      CNV Namespace: openshift-cnv
      Discovered users: {{ discovered_workshop_users | length }}

# ============================================================================
# KubeVirt Infrastructure Validation
# ============================================================================

- name: Check KubeVirt nodes for virtualization capabilities
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Node
    label_selectors:
      - kubevirt.io/schedulable=true
  register: r_kubevirt_nodes

- name: Add KubeVirt nodes result
  ansible.builtin.set_fact:
    validation_results: "{{ validation_results + [kubevirt_nodes_result] }}"
  vars:
    virt_nodes_count: "{{ r_kubevirt_nodes.resources | length }}"
    kubevirt_nodes_result:
      scope: "kubevirt_nodes"
      check: "KubeVirt schedulable nodes"
      status: "{{ 'PASS' if virt_nodes_count | int > 0 else 'FAIL' }}"
      detail: "{{ 'Found ' + (virt_nodes_count | string) + ' nodes with KubeVirt scheduling enabled' if virt_nodes_count | int > 0 else 'No nodes found with KubeVirt scheduling capability' }}"

# ============================================================================
# DataSources and Boot Images Validation
# ============================================================================

- name: Check for common DataSources
  kubernetes.core.k8s_info:
    api_version: cdi.kubevirt.io/v1beta1
    kind: DataSource
    namespace: openshift-virtualization-os-images
  register: r_kubevirt_datasources

- name: Add DataSources result
  ansible.builtin.set_fact:
    validation_results: "{{ validation_results + [datasources_result] }}"
  vars:
    datasources_count: "{{ r_kubevirt_datasources.resources | length }}"
    datasources_result:
      scope: "kubevirt_datasources"
      check: "KubeVirt DataSources available"
      status: "{{ 'PASS' if datasources_count | int > 0 else 'WARN' }}"
      detail: "{{ 'Found ' + (datasources_count | string) + ' OS DataSources available for VM creation' if datasources_count | int > 0 else 'No OS DataSources found (may need to be created)' }}"

# ============================================================================
# User VM Workloads Validation
# ============================================================================

- name: Check for user VM namespaces
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Namespace
  register: r_all_namespaces

- name: Filter user VM namespaces
  ansible.builtin.set_fact:
    user_vm_namespaces: "{{ r_all_namespaces.resources | default([]) | selectattr('metadata.name', 'match', '^vmimported-(' + discovered_workshop_users | join('|') + ')$') | list }}"
  when: r_all_namespaces.resources is defined

- name: Add user VM namespaces result
  ansible.builtin.set_fact:
    validation_results: "{{ validation_results + [user_vm_ns_result] }}"
  vars:
    vm_namespaces_count: "{{ user_vm_namespaces | default([]) | length }}"
    expected_count: "{{ discovered_workshop_users | length }}"
    user_vm_ns_result:
      scope: "kubevirt_user_namespaces"
      check: "User VM namespaces"
      status: "{{ 'PASS' if vm_namespaces_count | int == expected_count | int else 'WARN' if vm_namespaces_count | int > 0 else 'FAIL' }}"
      detail: "{{ 'Found ' + (vm_namespaces_count | string) + '/' + (expected_count | string) + ' user VM namespaces (vmimported-userN pattern)' }}"

- name: Check for VirtualMachines in user namespaces
  kubernetes.core.k8s_info:
    api_version: kubevirt.io/v1
    kind: VirtualMachine
    namespace: "{{ item.metadata.name }}"
  register: r_user_vms
  loop: "{{ user_vm_namespaces | default([]) }}"
  when: user_vm_namespaces | default([]) | length > 0

- name: Calculate total user VMs
  ansible.builtin.set_fact:
    total_user_vms: "{{ r_user_vms.results | default([]) | map(attribute='resources') | map('length') | list | sum }}"
  when: r_user_vms.results is defined

- name: Add user VMs result
  ansible.builtin.set_fact:
    validation_results: "{{ validation_results + [user_vms_result] }}"
  vars:
    vm_count: "{{ total_user_vms | default(0) | int }}"
    user_vms_result:
      scope: "kubevirt_user_vms"
      check: "User VirtualMachines"
      status: "{{ 'PASS' if vm_count > 0 else 'WARN' }}"
      detail: "{{ 'Found ' + (vm_count | string) + ' VirtualMachines across user namespaces' if vm_count > 0 else 'No VirtualMachines found in user namespaces (may not be created yet)' }}"

# ============================================================================
# VM Import/Migration Validation (MTV namespaces)
# ============================================================================

- name: Check for user MTV namespaces
  ansible.builtin.set_fact:
    user_mtv_namespaces: "{{ r_all_namespaces.resources | default([]) | selectattr('metadata.name', 'match', '^mtv-(' + discovered_workshop_users | join('|') + ')$') | list }}"
  when: r_all_namespaces.resources is defined

- name: Add user MTV namespaces result
  ansible.builtin.set_fact:
    validation_results: "{{ validation_results + [user_mtv_ns_result] }}"
  vars:
    mtv_namespaces_count: "{{ user_mtv_namespaces | default([]) | length }}"
    expected_count: "{{ discovered_workshop_users | length }}"
    user_mtv_ns_result:
      scope: "mtv_user_namespaces"
      check: "User MTV namespaces"
      status: "{{ 'PASS' if mtv_namespaces_count | int == expected_count | int else 'WARN' if mtv_namespaces_count | int > 0 else 'FAIL' }}"
      detail: "{{ 'Found ' + (mtv_namespaces_count | string) + '/' + (expected_count | string) + ' user MTV namespaces (mtv-userN pattern)' }}"

- name: Check for Plans in MTV namespaces
  kubernetes.core.k8s_info:
    api_version: forklift.konveyor.io/v1beta1
    kind: Plan
    namespace: "{{ item.metadata.name }}"
  register: r_user_plans
  loop: "{{ user_mtv_namespaces | default([]) }}"
  when: user_mtv_namespaces | default([]) | length > 0

- name: Calculate total MTV Plans
  ansible.builtin.set_fact:
    total_user_plans: "{{ r_user_plans.results | default([]) | map(attribute='resources') | map('length') | list | sum }}"
  when: r_user_plans.results is defined

- name: Add user Plans result
  ansible.builtin.set_fact:
    validation_results: "{{ validation_results + [user_plans_result] }}"
  vars:
    plans_count: "{{ total_user_plans | default(0) | int }}"
    user_plans_result:
      scope: "mtv_user_plans"
      check: "User MTV Plans"
      status: "{{ 'PASS' if plans_count > 0 else 'WARN' }}"
      detail: "{{ 'Found ' + (plans_count | string) + ' MTV Plans across user namespaces' if plans_count > 0 else 'No MTV Plans found in user namespaces (may not be created yet)' }}"

# ============================================================================
# Network Configuration Validation
# ============================================================================

- name: Check for NetworkAttachmentDefinitions
  kubernetes.core.k8s_info:
    api_version: k8s.cni.cncf.io/v1
    kind: NetworkAttachmentDefinition
    namespace: default
  register: r_network_attachments

- name: Add network attachments result
  ansible.builtin.set_fact:
    validation_results: "{{ validation_results + [network_attachments_result] }}"
  vars:
    networks_count: "{{ r_network_attachments.resources | length }}"
    network_attachments_result:
      scope: "kubevirt_networks"
      check: "VM Network attachments"
      status: "{{ 'PASS' if networks_count > 0 else 'WARN' }}"
      detail: "{{ 'Found ' + (networks_count | string) + ' NetworkAttachmentDefinitions for VM networking' if networks_count > 0 else 'No additional VM networks configured (using default pod network)' }}"

- name: "=== OpenShift Virtualization Validation Summary ==="
  ansible.builtin.debug:
    msg: |
      OpenShift Virtualization validation completed
      - KubeVirt nodes: {{ r_kubevirt_nodes.resources | length }}
      - DataSources: {{ r_kubevirt_datasources.resources | length }}
      - User VM namespaces: {{ user_vm_namespaces | default([]) | length }}/{{ discovered_workshop_users | length }}
      - User VMs: {{ total_user_vms | default(0) }}
      - User MTV namespaces: {{ user_mtv_namespaces | default([]) | length }}/{{ discovered_workshop_users | length }}
      - MTV Plans: {{ total_user_plans | default(0) }}
      - Network attachments: {{ r_network_attachments.resources | length }}